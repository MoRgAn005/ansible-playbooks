localhost ansible_connection=local

[staging]
web1 ansible_host=127.0.0.2 ansible_user=ansiblelab

[production]
web2 ansible_host=127.0.0.3 ansible_user=ansiblelab

[webservers:children]
staging
production

[webservers:vars]
ansible_port=2222
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_private_key_file=/root/.ssh/ansible-vsc1-lab
ansible_ssh_common_args=-o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/root/.ssh/ansible-vsc1-lab-known-hosts
